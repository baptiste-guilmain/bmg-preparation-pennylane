name: Vérifier le bundle Apps Script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node apps-script/build-appsscript.mjs
      - run: |
          if ! git diff --exit-code -- apps-script/Index.html; then
            echo "::error::apps-script/Index.html n'est pas à jour avec public/. Lancez 'node apps-script/build-appsscript.mjs' et committez le résultat."
            exit 1
          fi
