name: Vérifier le bundle Apps Script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node apps-script/build-appsscript.mjs
      - run: |
          if ! git diff --exit-code -- apps-script/Index.html; then
            echo "::error::apps-script/Index.html n'est pas à jour avec public/. Lancez 'node apps-script/build-appsscript.mjs' et committez le résultat."
            exit 1
          fi
      - name: Vérifie que le JS du bundle est syntaxiquement valide
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('apps-script/Index.html', 'utf8');
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) { console.error('Balise <script> introuvable.'); process.exit(1); }
            fs.writeFileSync('/tmp/bundle-check.js', m[1]);
          "
          node --check /tmp/bundle-check.js
